---
# tasks/delete_snapshots_vcenter.yml
# Called once per vCenter via include_tasks loop in delete_snapshots.yml.
# Expects:
#   current_vc_host      - vCenter hostname (loop_var)
#   vcenter_creds        - dict of {hostname: {host, user, password}}
#   vms_by_vcenter       - dict of {hostname: [vm list]}
#   snapshot_cutoff_iso  - ISO-8601 UTC cutoff; older snapshots are expired
#   snap_pattern         - regex a snapshot name must match to be eligible
#   snap_remove_children - also remove child snapshots (bool)
#   snap_dry_run         - report only, delete nothing (bool)
#   deletion_results     - list accumulating per-vCenter summaries

- name: "Set working vars for {{ current_vc_host }}"
  ansible.builtin.set_fact:
    _vc: "{{ vcenter_creds[current_vc_host] }}"
    _vms: "{{ vms_by_vcenter[current_vc_host] }}"
    _snap_pairs: []
    _expired: []
    _unreadable: []
    _del_failed_details: []
    _in_scope: []
    _critical_all: []
    _critical_retained: []
    _expired_critical: []
    _expired_regular: []

- name: "Skip {{ current_vc_host }} — no VMs assigned in CSV"
  ansible.builtin.debug:
    msg: "No VMs assigned to {{ current_vc_host }} in CSV — skipping."
  when: _vms | length == 0

# ---------------------------------------------------------------------------
# Phase 1 — read the existing snapshots for every VM on this vCenter
# ---------------------------------------------------------------------------
- name: "Fire async snapshot-info tasks for {{ current_vc_host }} ({{ _vms | length }} VMs)"
  community.vmware.vmware_guest_snapshot_info:
    hostname: "{{ _vc.host }}"
    username: "{{ _vc.user }}"
    password: "{{ _vc.password }}"
    validate_certs: false
    datacenter: "{{ item.datacenter }}"
    folder: "/{{ item.datacenter }}/vm"
    name: "{{ item.vm_name }}"
  loop: "{{ _vms }}"
  loop_control:
    label: "{{ item.vm_name }}"
  async: 300
  poll: 0
  ignore_errors: true
  register: _async_info_jobs
  when: _vms | length > 0

- name: "Wait for all snapshot-info jobs on {{ current_vc_host }}"
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ _async_info_jobs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.vm_name }}"
  register: _info_results
  until: _info_results.finished
  retries: 60
  delay: 5
  ignore_errors: true
  when: _vms | length > 0

- name: "Record VMs whose snapshots could not be read on {{ current_vc_host }}"
  ansible.builtin.set_fact:
    _unreadable: >-
      {{ _info_results.results
         | default([])
         | selectattr('failed', 'defined')
         | selectattr('failed', 'equalto', true)
         | map(attribute='item.item.vm_name')
         | list }}
  when: _vms | length > 0

# Flatten every VM's snapshot list into one list of snapshot dicts, each
# carrying the vm_name/datacenter it belongs to.
- name: "Flatten VM/snapshot pairs for {{ current_vc_host }}"
  ansible.builtin.set_fact:
    _snap_pairs: >-
      {{ _snap_pairs + (
           (_res.guest_snapshots | default({})).snapshots | default([])
           | map('combine', {
               'vm_name': _res.item.item.vm_name,
               'datacenter': _res.item.item.datacenter
             })
           | list
         ) }}
  loop: >-
    {{ _info_results.results
       | default([])
       | selectattr('failed', 'defined')
       | selectattr('failed', 'equalto', false)
       | list }}
  loop_control:
    loop_var: _res
    label: "{{ _res.item.item.vm_name }}"
  when: _vms | length > 0

# ---------------------------------------------------------------------------
# Phase 2 — work out which of those snapshots are past the retention window
# ---------------------------------------------------------------------------
# creation_time is an ISO-8601 UTC string, so a plain string comparison
# against the 19-character cutoff is a correct chronological comparison.
# Split the snapshots in scope into the two retention tiers, then apply each
# tier's own cutoff. Critical snapshots live longer but are not immortal.
- name: "Split snapshots into retention tiers on {{ current_vc_host }}"
  ansible.builtin.set_fact:
    _in_scope: >-
      {{ _snap_pairs
         | selectattr('creation_time', 'defined')
         | rejectattr('creation_time', 'none')
         | selectattr('name', 'search', snap_pattern)
         | list }}
  when: _vms | length > 0

- name: "Select expired snapshots on {{ current_vc_host }} (both tiers)"
  ansible.builtin.set_fact:
    _critical_all: >-
      {{ _in_scope | selectattr('name', 'search', snap_critical_regex) | list }}
    _expired_critical: >-
      {{ _in_scope
         | selectattr('name', 'search', snap_critical_regex)
         | selectattr('creation_time', 'lt', snapshot_critical_cutoff_iso)
         | list }}
    _expired_regular: >-
      {{ _in_scope
         | rejectattr('name', 'search', snap_critical_regex)
         | selectattr('creation_time', 'lt', snapshot_cutoff_iso)
         | list }}
  when: _vms | length > 0

- name: "Combine both tiers into the deletion set for {{ current_vc_host }}"
  ansible.builtin.set_fact:
    _expired: "{{ _expired_regular + _expired_critical }}"
    _critical_retained: >-
      {{ _critical_all
         | selectattr('creation_time', 'ge', snapshot_critical_cutoff_iso)
         | list }}
  when: _vms | length > 0

- name: "Critical snapshots still within retention on {{ current_vc_host }}"
  ansible.builtin.debug:
    msg: >-
      RETAINED (critical): {{ item.vm_name }} :: '{{ item.name }}'
      created {{ item.creation_time }} — kept until
      {{ snap_critical_retention_days }} days old
  loop: "{{ _critical_retained }}"
  loop_control:
    label: "{{ item.vm_name }} :: {{ item.name }}"

# Audit trail: every snapshot found and the verdict on it. Without this an
# "Expired found: 0" run gives no clue whether the snapshots were too new,
# were filtered out by name, or were never there at all.
- name: "All snapshots found on {{ current_vc_host }} — retention verdict"
  ansible.builtin.debug:
    msg: >-
      {{ item.vm_name }} :: '{{ item.name }}'
      created {{ item.creation_time | default('unknown') }} ->
      {{ ('DELETE (CRITICAL, older than ' ~ snap_critical_retention_days ~ ' days)'
          if item.name is search(snap_critical_regex)
          else 'DELETE (older than ' ~ snap_retention_days ~ ' days)')
         if item in _expired
         else ('KEEP (name does not match ' ~ snap_pattern ~ ')'
               if snap_pattern and not (item.name is search(snap_pattern))
               else ('KEEP (CRITICAL, retained until ' ~ snap_critical_retention_days ~ ' days old)'
                     if item.name is search(snap_critical_regex)
                     else 'KEEP (newer than cutoff ' ~ snapshot_cutoff_iso ~ ')')) }}
  loop: "{{ _snap_pairs }}"
  loop_control:
    label: "{{ item.vm_name }} :: {{ item.name }}"

- name: "No snapshots at all on {{ current_vc_host }}"
  ansible.builtin.debug:
    msg: >-
      No snapshots found on any of the {{ _vms | length }} VM(s) queried on
      {{ current_vc_host }}. If you expected some, check the vm_name and
      datacenter values in the CSV.
  when:
    - _vms | length > 0
    - _snap_pairs | length == 0

- name: "Nothing to delete on {{ current_vc_host }}"
  ansible.builtin.debug:
    msg: >-
      {{ _snap_pairs | length }} snapshot(s) found on {{ current_vc_host }},
      none eligible for deletion (see the verdict list above).
      Retention {{ snap_retention_days }} days, cutoff {{ snapshot_cutoff_iso }}.
  when:
    - _vms | length > 0
    - _snap_pairs | length > 0
    - _expired | length == 0

# ---------------------------------------------------------------------------
# Phase 3 — delete them (skipped entirely in dry-run mode)
# ---------------------------------------------------------------------------
- name: "DRY RUN — {{ _expired | length }} snapshot(s) would be deleted on {{ current_vc_host }}"
  ansible.builtin.debug:
    msg: "Dry run enabled (delete_dry_run=true) — no snapshots were removed."
  when:
    - _expired | length > 0
    - snap_dry_run | bool

- name: "Fire async snapshot deletions for {{ current_vc_host }} ({{ _expired | length }} snapshots)"
  community.vmware.vmware_guest_snapshot:
    hostname: "{{ _vc.host }}"
    username: "{{ _vc.user }}"
    password: "{{ _vc.password }}"
    validate_certs: false
    datacenter: "{{ item.datacenter }}"
    folder: "/{{ item.datacenter }}/vm"
    name: "{{ item.vm_name }}"
    state: absent
    snapshot_name: "{{ item.name }}"
    remove_children: "{{ snap_remove_children | bool }}"
  loop: "{{ _expired }}"
  loop_control:
    label: "{{ item.vm_name }} :: {{ item.name }}"
  async: 1800
  poll: 0
  ignore_errors: true
  register: _async_del_jobs
  when:
    - _expired | length > 0
    - not (snap_dry_run | bool)

- name: "Wait for all deletion jobs on {{ current_vc_host }}"
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ _async_del_jobs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.vm_name }} :: {{ item.item.name }}"
  register: _del_results
  until: _del_results.finished
  retries: 120
  delay: 15
  ignore_errors: true
  when:
    - _expired | length > 0
    - not (snap_dry_run | bool)

# Keep the reason each deletion failed, not just which snapshot it was.
- name: "Collect deletion failure reasons for {{ current_vc_host }}"
  ansible.builtin.set_fact:
    _del_failed_details: >-
      {{ _del_failed_details | default([]) + [
           _r.item.item | combine({
             'msg': (_r.msg | default('(no message returned)')) | string | trim
           })
         ] }}
  loop: >-
    {{ _del_results.results
       | default([])
       | selectattr('failed', 'defined')
       | selectattr('failed', 'equalto', true)
       | list }}
  loop_control:
    loop_var: _r
    label: "{{ _r.item.item.vm_name }} :: {{ _r.item.item.name }}"

- name: "Append {{ current_vc_host }} results to deletion_results"
  ansible.builtin.set_fact:
    deletion_results: >-
      {{ deletion_results + [{
           'vcenter':    current_vc_host,
           'total':      _vms | length,
           'unreadable': _unreadable,
           'snapshots':  _snap_pairs | length,
           'expired':    _expired,
           'critical_all':      _critical_all,
           'critical_retained': _critical_retained,
           'expired_critical':  _expired_critical,
           'expired_regular':   _expired_regular,
           'deleted':    _del_results.results
                         | default([])
                         | selectattr('failed', 'defined')
                         | selectattr('failed', 'equalto', false)
                         | map(attribute='item.item')
                         | list,
           'failed':     _del_failed_details | default([])
         }] }}

- name: "{{ current_vc_host }} — retention summary"
  ansible.builtin.debug:
    msg:
      - "=== {{ current_vc_host }} — retention: {{ snap_retention_days }} days (cutoff {{ snapshot_cutoff_iso }}) ==="
      - "  VMs scanned       : {{ _vms | length }}"
      - "  Unreadable VMs    : {{ _unreadable | length }}{{ ' -> ' ~ _unreadable | join(', ') if _unreadable else '' }}"
      - "  Snapshots found   : {{ _snap_pairs | length }}"
      - "  Expired snapshots : {{ _expired | length }} ({{ _expired_regular | length }} regular + {{ _expired_critical | length }} critical)"
      - "  Critical retained : {{ _critical_retained | length }} of {{ _critical_all | length }}"
      - "  Deleted           : {{ deletion_results[-1].deleted | length }}{{ ' (dry run)' if snap_dry_run | bool else '' }}"
      - "  Failed            : {{ deletion_results[-1].failed | length }}"
