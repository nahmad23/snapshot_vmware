[local]
# Everything runs on the controller (connection=local).
# Pin the Python interpreter explicitly so module execution does not pick up
# a bad ansible_python_interpreter from the environment. This must be a real
# Python that has PyVmomi installed:
#   /usr/bin/python3.12 -m pip install --upgrade pyvmomi
localhost ansible_connection=local ansible_python_interpreter=/usr/bin/python3.12
